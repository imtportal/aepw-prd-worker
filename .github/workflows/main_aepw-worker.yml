name: Build and Deploy Azure Function

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'aepw-worker'
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Aepw.Evidence.Worker.csproj'
  PUBLISH_DIR: './publish'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # 4. Build project
      - name: Build
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-restore

      # 5. Publish Function App
      - name: Publish Function App
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --output ${{ env.PUBLISH_DIR }}

      # 6. Validate deployment package
      - name: Verify Function package
        run: |
          set -e

          echo "===== PUBLISH FILES ====="
          find ${{ env.PUBLISH_DIR }} -maxdepth 2 -type f | sort

          echo "===== REQUIRED FILE VALIDATION ====="

          test -f ${{ env.PUBLISH_DIR }}/host.json
          test -f ${{ env.PUBLISH_DIR }}/functions.metadata
          test -f ${{ env.PUBLISH_DIR }}/worker.config.json

          echo "All required Function App files are present."

          echo "===== PACKAGE SIZE ====="
          du -sh ${{ env.PUBLISH_DIR }}

      # 7. Deploy to Azure Function App
      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
